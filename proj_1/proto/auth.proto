syntax = "proto3";

package auth;

service AuthService {
    rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
}

message RegisterUserRequest {
    string email = 1;
    string password = 2;
}

message RegisterUserResponse {
    string message = 2;
    User user = 3;
}

message User {
    string _id = 1;
    string email = 2;
    string name = 3;
}