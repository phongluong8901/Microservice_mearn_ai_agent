syntax = "proto3";

package auth;

// Định nghĩa một gRPC service
service AuthService {
    rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse); // Hàm RPC đăng ký tài khoản
    rpc verifyUserEmail(verifyUserEmailRequest) returns (verifyUserEmailResponse); // Hàm RPC xác thực email người dùng qua OTP
    rpc LoginUser(LoginUserRequest) returns (LoginUserResponse); // Hàm RPC xử lý đăng nhập hệ thống
}

// Cấu trúc dữ liệu gửi lên khi client yêu cầu đăng ký tài khoản
message RegisterUserRequest {
    string email = 1; // Trường email kiểu chuỗi, định danh ở vị trí số 1 trong Protobuf binary
    string password = 2; // Trường mật khẩu kiểu chuỗi, định danh ở vị trí số 2
}

message RegisterUserResponse {
    string message = 2;
    User user = 3;
}

// Cấu trúc dữ liệu chung mô tả thông tin cơ bản của một người dùng
message User {
    string _id = 1;
    string email = 2;
    string name = 3;
}

message verifyUserEmailRequest {
    string email = 1;
    string otpCode = 2;
}

message verifyUserEmailResponse {
    bool success = 1;
    string message = 2;
}

//login types
message LoginUserRequest {
    string email = 1;
    string password = 2;
}

// Cấu trúc chứa các mã thông báo xác thực bảo mật (tokens)
message Token {
    string accessToken = 1;
    string refreshToken = 2;
}

// Cấu trúc gom nhóm thông tin trả về sau khi đăng nhập thành công
message UserData {
    Token token = 1;
    User user = 2;
    bool isLoggedIn = 3;
}

message LoginUserResponse {
    UserData userData = 1;
}